name: ci

# Lightweight gates on every push and pull request: format + build + vet + test
# (macOS only — Gropius is a macOS menu-bar app that links AppKit/systray via cgo
# and uses darwin-only syscalls, so it does not build on Linux like the
# cross-platform sibling projects do), plus full-history secret scanning and a
# workflow self-audit.
on:
  push:
    branches: ['**']
  pull_request:
  # The merge queue. A queued entry is built on its own temporary ref carrying
  # the candidate merged with everything ahead of it, and the queue waits for
  # THIS workflow's checks on that ref. Without this trigger the queue has
  # nothing to wait for: entries sit until check_response_timeout_minutes
  # expires and are then dropped, so enabling the queue rule without this line
  # stops every merge rather than ordering it.
  merge_group:

# Cancel superseded runs of the same ref (PRs and branch pushes); a merged
# main push is never cancelled mid-run because each ref has its own group.
# A merge_group run is never cancelled either: each queue entry has its own
# unique ref, so nothing can supersede one, and a cancelled check reads to the
# queue as a failed entry — it would evict a change that was never tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # Format + build + vet + test on macOS. Race-enabled unit tests over the
  # platform-independent internal packages catch data races a plain `go test`
  # would miss; the race leg is scoped to internal/... to keep this gate fast —
  # full-module race coverage (including cmd/gropius) runs in `make test`
  # locally and in the release workflow's gate.
  check:
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'

      # gofmt -l lists any unformatted file; a non-empty list fails the job.
      - name: Format (gofmt)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt: these files are not formatted (run gofmt -w .):" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (race, internal)
        run: go test -race ./internal/...

  # Secrets never land in history: full-history scan on every push/PR. Run as a
  # pinned, checksum-verified CLI (not the marketplace action), so it needs no
  # GitHub Advanced Security and its supply chain is hash-anchored. A non-zero
  # exit means gitleaks found a secret.
  gitleaks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf -o "$base" "$url/$base"
          curl -sSLf -o checksums.txt "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $base\$" checksums.txt | sha256sum -c -
          tar -xzf "$base" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --redact --no-banner .

  # Audit the workflows themselves (pwn requests, template injection, cache
  # poisoning, unpinned uses). Run as a digest-pinned CLI image (no SARIF upload
  # to code-scanning). A non-zero exit means a finding.
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Audit workflows
        run: |
          # zizmor v1.26.1, pinned by digest (the registry publishes version
          # releases under :latest; a raw vX.Y.Z tag does not exist).
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" \
            ghcr.io/zizmorcore/zizmor@sha256:d1117e5dbd9ee4970644067b534ab6ab50371f3c6f7f4d05446eb603a6e78f48 \
            --persona regular /src
