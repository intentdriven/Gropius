name: release

# Pushing a version tag (vX.Y.Z) re-runs the full verification gate against the
# PUSHED COMMIT; only if that gate is green does it build and publish a GitHub
# Release from that same commit. Nothing is pushed to any branch, and the whole
# path runs on the built-in GITHUB_TOKEN. Both jobs check out `github.sha` — the
# commit the pushed tag pointed at — never the re-resolvable tag NAME and never the
# default-branch tip. A manual workflow_dispatch runs the rehearsal (below), which
# arms the gate against a simulated release and publishes nothing.
on:
  push:
    tags:
      - 'v*'
  # Called by auto-release.yml after it tags the newest dated CHANGELOG version
  # (adr-37). `tag` and `ref` are an unenforced caller CONTRACT — --verify-tag
  # checks only that the tag exists, not that it points at `ref`; the sole
  # caller (auto-release) binds them: ref = `git rev-parse "$tag^{commit}"` on
  # the re-release path, empty (-> github.sha, the just-tagged commit) on the
  # fresh-tag path. A resolved commit SHA, never a tag name, keeps the
  # anti-tag-move property.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ''
  # Manual rehearsal. A workflow_dispatch runs the `rehearsal` job below alongside
  # `verify`, and nothing that publishes: the publish job (`release`) is gated off
  # this event, and the rehearsal arms the gate's resolution path against a
  # simulated changelog roll and reviewed-content commit, proves the deterministic
  # gates admit it, and creates no tag, Release, or attestation. Run it green
  # once before the first real release (see
  # the release-gate runbook) — it closes the private->public activation gap that
  # otherwise surfaces only when the gate first meets a real tag.
  workflow_dispatch:

# The released tag name. workflow_call: inputs.tag (the tag auto-release just
# made). push-tag: inputs is empty, so this falls through to github.ref_name
# (the vX.Y.Z ref that triggered the run). Only the NAME — no job ever checks
# out this name; both check out the immutable commit SHA below.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Never run two releases of the same tag concurrently, and never cancel a release
# mid-flight — a half-published release is worse than a queued one.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Floor for the workflow: read-only. The release job elevates itself to
# contents: write only to create the Release and upload its assets; verify stays
# read-only. No job pushes to any branch.
permissions:
  contents: read

jobs:
  # Gate the release on the pushed commit: the deterministic verification gate
  # (gofmt, build, vet, test, the race leg). A red step here aborts before anything
  # is built or published. Checked out at github.sha — the commit the pushed tag
  # pointed at, never the default-branch tip or the re-resolvable tag name — so the
  # gate exercises exactly the commit that will ship.
  verify:
    timeout-minutes: 15
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha, not the tag ref: checkout re-resolves a NAMED ref at each
          # job's start, so a tag moved after the push could differ here. The sha is
          # the commit the pushed tag pointed at, immutable for this run. On the
          # workflow_call path, inputs.ref (a resolved commit SHA) overrides for
          # the re-release-from-tag case; empty inputs.ref falls through to
          # github.sha = the caller's HEAD = the commit auto-release just tagged.
          ref: ${{ inputs.ref || github.sha }}
          # Full history so any gate that inspects committed history stays accurate.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          # cache: false — this workflow is tag-triggered; module caching in a
          # release-triggering workflow is a cache-poisoning vector (zizmor).
          cache: false

      - name: Format (gofmt)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt: these files are not formatted (run gofmt -w .):" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # A generic module may have no internal tree, so the race leg runs over the
      # whole module; a package-scoped pattern would fail every run with a
      # "no such file or directory" and wedge the release.
      - name: Test (race)
        run: go test -race ./...

  # Build and publish ONLY after verify is green. Binaries are cross-compiled from
  # the same pushed commit (github.sha) that verify just gated, so the shipped
  # artefacts match the code that passed — even if the tag were re-pointed since.
  release:
    needs: verify
    # The publish path never runs on a manual rehearsal (workflow_dispatch): that
    # event runs the `rehearsal` job, which publishes nothing. The tag-push and
    # workflow_call (auto-release) entry points are unaffected.
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: macos-26
    permissions:
      contents: write       # create the Release and upload its assets (no branch push)
      id-token: write       # mint the OIDC token attest-build-provenance signs with
      attestations: write   # publish the build-provenance attestations (public repo)
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha (the commit the pushed tag pointed at), not the tag NAME and
          # not the default-branch tip, so the binaries below are built from the exact
          # commit verify gated. inputs.ref (resolved SHA) overrides on the
          # workflow_call re-release path, exactly as in verify.
          ref: ${{ inputs.ref || github.sha }}
          # Full history, so any history-walking gate has the commits it needs.
          fetch-depth: 0
          persist-credentials: false

      - name: Record the default-branch tip (no-branch-commit tripwire)
        # This release job must push NOTHING to any branch. Record the remote
        # default-branch tip now; the closing step re-reads it and fails the run if
        # the branch moved because of this job. Read the ref through the API with
        # GH_TOKEN: an anonymous `git ls-remote` cannot authenticate to a private repo,
        # and checkout ran with persist-credentials: false.
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')"
          test -n "$sha"
          echo "DEFAULT_BRANCH_START_SHA=$sha" >> "$GITHUB_ENV"
          echo "default-branch tip at job start: $sha"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache: false

      - name: Build the server app (Gropius.app, arm64, ad-hoc signed)
        run: make app VERSION="$TAG"

      - name: Build the client app (GropiusChat.app, universal)
        run: VERSION="$TAG" client/build.sh

      # Sanity-check the architectures before shipping: the server must be arm64
      # (MLX is Metal-only) and the client must be universal so it runs on Intel
      # Macs too. A wrong-arch binary that still zips fine would otherwise ship
      # silently.
      - name: Verify binary architectures
        run: |
          set -euo pipefail
          server="dist/Gropius.app/Contents/MacOS/gropius"
          client="client/dist/GropiusChat.app/Contents/MacOS/GropiusChat"
          echo "server: $(lipo -archs "$server")"
          echo "client: $(lipo -archs "$client")"
          lipo -archs "$server" | grep -qw arm64 || { echo "server is not arm64" >&2; exit 1; }
          lipo -archs "$client" | grep -qw arm64 || { echo "client missing arm64" >&2; exit 1; }
          lipo -archs "$client" | grep -qw x86_64 || { echo "client missing x86_64 (not universal)" >&2; exit 1; }

      # Package each .app so it extracts to `<App>.app` at the archive root —
      # exactly what install.sh's `ditto -x -k` step expects (--keepParent keeps
      # the .app directory as the top-level entry).
      # The checksums file is what install.sh verifies against: it is published
      # on the same Release as the zips (same origin), and the attestation below
      # binds every asset to this workflow run. No offline signing key: the trust
      # bar is same-origin checksums plus GitHub build provenance, with building
      # from source as the escape hatch.
      - name: Package the apps and write the checksums
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/Gropius.app Gropius.app.zip
          ditto -c -k --keepParent client/dist/GropiusChat.app GropiusChat.app.zip
          shasum -a 256 Gropius.app.zip GropiusChat.app.zip | tee SHA256SUMS.txt

      # Build-provenance attestation over exactly the bytes published below.
      # Anyone can verify an asset came from this workflow on this repository:
      #   gh attestation verify Gropius.app.zip --repo <owner>/<repo>
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Gropius.app.zip
            GropiusChat.app.zip
            SHA256SUMS.txt

      # Create the Release if it doesn't exist yet, otherwise attach/replace the
      # assets on the existing one. --clobber makes re-runs idempotent. install.sh
      # fetches `releases/latest/download/<asset>`, so the Release must be a
      # normal (non-draft, non-prerelease) published release — which is the
      # default for both paths here. The checksums file rides alongside the
      # zips; install.sh verifies the download against it before installing.
      # --verify-tag: refuse to publish unless the tag already exists remotely —
      # existence only; it does not check what the tag points at (see the contract
      # note at the top of this file). --generate-notes lists the merged PRs since
      # the previous tag; CHANGELOG.md remains the durable record.
      # GITHUB_TOKEN-only: no personal access token, no elevated secret.
      - name: Publish the Release with both apps attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets="Gropius.app.zip GropiusChat.app.zip SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets."
            gh release upload "$TAG" $assets --clobber
          else
            echo "Release $TAG does not exist — creating it."
            # GitHub marks the most recently *created* release as "latest" by
            # default, so re-publishing an old tag would hijack releases/latest
            # and silently downgrade every install.sh run. Mark this release
            # latest only if no newer released tag exists. The listing is
            # fetched on its own line so a failed gh call aborts the step
            # instead of silently yielding latest=true.
            # Under semantic versioning a hyphen introduces the pre-release
            # identifiers, so the tag alone classifies itself — no lookup, and
            # nothing that can fall out of step with the forge.
            case "$TAG" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
            esac

            if [ "$prerelease" = true ]; then
              # A candidate is never the release install.sh fetches. Two things
              # went wrong here and either alone still leaves the hole. It was
              # published without --prerelease, so it became an ordinary release
              # that no later --exclude-pre-releases query can filter; and the
              # election below appended $TAG to a candidate list it had just
              # filtered, so the tag under consideration bypassed the very
              # exclusion meant to keep it out. Not electing at all on a
              # pre-release tag closes the second by construction.
              echo "Publishing $TAG as a pre-release; releases/latest is left alone."
              gh release create "$TAG" $assets \
                --verify-tag --title "$TAG" --prerelease --latest=false --generate-notes
            else
              released="$(gh release list --exclude-drafts --exclude-pre-releases \
                --json tagName --jq '.[].tagName')"
              # Drop pre-release-shaped tags on this side too, rather than
              # trusting the forge's flag alone: a candidate published before
              # this rule existed carries no pre-release flag there, so the
              # query still returns it — and `sort -V` orders v0.4.0-rc1 AFTER
              # v0.4.0, the opposite of the semantic version rule, so one such
              # tag would beat every real release that follows it, for ever.
              #
              # Filtered with the shell's own `case` rather than with grep. The
              # obvious spelling, `grep -v -- '-'`, is not portable: it is
              # refused outright by at least one grep implementation that people
              # install over the system one, and a release election is a bad
              # place to depend on which grep a PATH happens to resolve.
              # Compared pairwise rather than by accumulating a list: building a
              # newline-separated list inside an indented YAML block folds the
              # block's own indentation into the values, and `sort -V` would then
              # be ranking tags with leading spaces and the equality test below
              # would never match. Seeding with $TAG also states the rule
              # directly — this tag is latest unless some released tag beats it.
              newest="$TAG"
              for candidate in $released; do
                case "$candidate" in
                *-*) continue ;;
                esac
                newest="$(printf '%s\n%s\n' "$newest" "$candidate" | sort -V | tail -n1)"
              done
              if [ "$newest" = "$TAG" ]; then latest=true; else latest=false; fi
              echo "Marking $TAG with --latest=$latest (newest released tag: $newest)."
              gh release create "$TAG" $assets \
                --verify-tag --title "$TAG" --latest="$latest" --generate-notes
            fi
          fi

      - name: Assert the release job pushed nothing to the default branch
        # Close the no-branch-commit tripwire opened at job start. Runs last so it
        # covers every preceding step. !cancelled(): the tripwire must still run when
        # an earlier step FAILED — an abnormal run is exactly when an unexpected push
        # most needs catching. If the tip is unchanged, done. If it moved, a push from
        # this job would land as github-actions[bot], so a bot commit in the moved
        # range fails the run, while an unrelated concurrent human merge is tolerated.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          end="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')"
          if [ "$end" = "${DEFAULT_BRANCH_START_SHA}" ]; then
            echo "default branch unchanged across the release job (${end}); the job pushed nothing."
            exit 0
          fi
          committers="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH_START_SHA}...${end}" \
            --jq '[.commits[].committer.login // "unknown"] | unique | join(" ")')"
          echo "default branch moved during the release job: ${DEFAULT_BRANCH_START_SHA} -> ${end} (committers: ${committers})"
          case " ${committers} " in
            *" github-actions[bot] "*)
              echo "a github-actions[bot] commit landed on the default branch during this job — the release workflow must never push to a branch" >&2
              exit 1
              ;;
          esac
          echo "movement attributed to commits outside this job; the release job itself pushed nothing."
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the landing page from the release this run just made. NON-GATING by
  # construction: it `needs: release`, so it cannot start until the Release, its
  # assets and its attestations exist, and nothing it does can change a byte of
  # them. A site failure turns this run red — a called workflow's failure is the
  # caller's — and the release stands.
  #
  # PERMISSIONS are the CAP on the called workflow: a job inside it can never
  # exceed what is granted here (the lesson of PR #4). site.yml's three jobs each
  # ask for `contents: read` and nothing else, so that is all this grants. It is
  # also within what auto-release.yml grants this workflow on the primary path.
  #
  # SECRETS. `inherit` rather than a named `secrets:` block, and the named form is
  # not an option rather than a preference: a job that calls a reusable workflow
  # may not declare `environment:`, so this caller can never resolve
  # CLOUDFLARE_API_TOKEN out of the `site` environment in order to pass it on by
  # name. The callee's `deploy` job resolves it from its own `environment: site`.
  #
  # The reasonable objection is that GitHub documents environment secrets as
  # resolving at the callee's job level regardless of what a caller passes, which
  # would make this line unnecessary. That is not what the two-level shape was
  # MEASURED to do: abcd ran a canary environment secret through exactly this
  # caller -> release -> site chain and found it empty at the deploy step unless
  # `inherit` appears at every level; its production deploy failed on a
  # credential that had never been conveyed until the missing line was added
  # (iss-2608231912566984). auto-release.yml's own call to this workflow carries
  # the matching line and names this one — the two are one mechanism, not two.
  #
  # What `inherit` conveys is this workflow's own secrets context, which reaches
  # site.yml's uncredentialed `render` job as well as `deploy`. Here that set is
  # empty: `gh api repos/<owner>/<repo>/actions/secrets` and the organization-
  # secrets endpoint both report 0, so nothing but GITHUB_TOKEN crosses, and
  # every credential this chain uses is environment-scoped. If this repository
  # ever gains a repository-scoped or organization secret, revisit this line
  # before that secret exists: at that point `inherit` would start handing it to
  # a job the spec says holds none.
  #
  # inputs.tag on the auto-release path, github.ref_name on a tag push: the same
  # derivation as the TAG env at the top of this file, repeated because the env
  # context is not available in a job's `with:` block.
  site:
    needs: release
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/site.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # The manual rehearsal (workflow_dispatch). It arms the full gate against a
  # SIMULATED changelog roll and reviewed-content commit — reproducing the
  # two-commit release-branch shape and the auto-release merge — proves the gate
  # resolves and admits, and PUBLISHES NOTHING: it holds contents: read only (so
  # it cannot create a tag, Release, or attestation even by mistake), pushes
  # nothing, and every mutation stays in the runner's throwaway checkout. A green
  # rehearsal is the runbook precondition for the first real release.
  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the content-commit resolution below can walk parents,
          # exactly as release.yml's semantic gate does.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache: false

      - name: Simulate a changelog roll and the two-commit release branch
        # No ${{ }} interpolation (injection-safe): the script writes only the
        # runner's throwaway checkout and $GITHUB_ENV. Nothing here is pushed.
        run: |
          set -euo pipefail
          git config user.name 'rehearsal[bot]'
          git config user.email 'rehearsal@localhost'
          base="$(git rev-parse --verify HEAD)"
          date="$(date -u +%Y-%m-%d)"
          # Content commit on a scratch branch: simulate rolling [Unreleased] into a
          # dated heading — the reviewed content commit a real release names.
          git switch -q -c rehearsal-sim
          if grep -q '^## \[Unreleased\]' CHANGELOG.md 2>/dev/null; then
            awk -v d="$date" '1; /^## \[Unreleased\]/ && !done {print ""; print "## [0.0.0-rehearsal] - " d; done=1}' CHANGELOG.md > CHANGELOG.rehearsal
            mv CHANGELOG.rehearsal CHANGELOG.md
          else
            printf '\n## [0.0.0-rehearsal] - %s\n' "$date" >> CHANGELOG.md
          fi
          git add -A
          git commit -q -m 'rehearsal: simulated changelog roll (content commit)'
          content="$(git rev-parse --verify HEAD)"
          # Receipts commit: names the content commit and sits one commit later —
          # the two-commit shape that keeps the receipt-vs-tag self-reference from
          # ever blocking the release.
          mkdir -p ".abcd/work/reviews/$content"
          printf '{"rehearsal":true,"content":"%s"}\n' "$content" > ".abcd/work/reviews/$content/rehearsal.json"
          git add -A
          git commit -q -m 'rehearsal: simulated receipts commit'
          # Merge into the base, reproducing the auto-release merge whose second
          # parent is the receipts commit (so HEAD^2^ resolves the content commit).
          git switch -q -c rehearsal-merge "$base"
          git merge -q --no-ff -m 'rehearsal: merge simulated release' rehearsal-sim
          echo "REHEARSAL_CONTENT_SHA=$content" >> "$GITHUB_ENV"

      - name: Resolve the reviewed content commit (release.yml's derivation)
        # Mirrors release.yml's resolve step exactly: HEAD^2^ on the merge path,
        # HEAD^ on a direct tag. Asserts the resolution lands on the simulated
        # content commit and is an ancestor of the released commit.
        run: |
          set -euo pipefail
          released="$(git rev-parse --verify HEAD)"
          if git rev-parse -q --verify "HEAD^2" >/dev/null 2>&1; then
            content="$(git rev-parse --verify "HEAD^2^")"
          else
            content="$(git rev-parse --verify "HEAD^")"
          fi
          test -n "$content"
          git merge-base --is-ancestor "$content" "$released"
          test "$content" = "${REHEARSAL_CONTENT_SHA}"
          echo "rehearsal: the gate would arm against content commit $content (present in the released tree)"

      - name: Prove the gate admits and nothing was published
        run: |
          set -euo pipefail
          # Build the simulated tree — the deterministic leg the gate requires.
          go build ./...
          echo "rehearsal: gate arming resolved; the deterministic gates admit the simulated roll."
          echo "rehearsal: nothing published — no tag, Release, or attestation was created (contents: read)."
